<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="{{token}}">
  <title>Work apps</title>
  <link rel="stylesheet" href="/page.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Work apps</h1>
        <p class="hint">Each app opens on its own workspace when you start your work day.</p>
      </div>
      <button id="start" class="primary">Start work apps</button>
    </header>
    <label class="setting">
      <input id="window-titles" type="checkbox">
      Name each app's window for title bars (used by window-names)
    </label>
    <p id="report" class="report" hidden></p>
    <section id="workspaces"></section>
    <form id="new-workspace" class="new-workspace">
      <input id="new-number" type="number" min="1" aria-label="Workspace number" required>
      <input id="new-label" placeholder="New workspace name" aria-label="Workspace name" required>
      <button>Add workspace</button>
    </form>
  </main>
  <div id="toast" class="toast" role="alert" hidden></div>
  <script src="/page.js"></script>
</body>
</html>
